project:
  type: website
  output-dir: docs

website:
  title: "David Palacio — Data Science Portfolio"
  description: "Análisis de datos y modelos predictivos en Python"
  favicon: "assets/favicon.ico"
  open-graph: true

  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: ecobici.qmd
        text: EcoBici
    right:
      - icon: github
        href: https://github.com/davidpalacio1
      - icon: linkedin
        href: https://www.linkedin.com/in/davidpalacio-velasquez-3864b6298

  page-footer:
    center: "David Palacio Velásquez · Ciencias de Datos, UBA · 2026"

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: true
    toc-depth: 3
    toc-title: "Contenido"
    code-fold: true
    code-tools: true
    code-copy: true
    highlight-style: github
    fig-align: center
    fig-width: 10
    fig-height: 5
    embed-resources: false
    smooth-scroll: true
    df-print: paged

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
